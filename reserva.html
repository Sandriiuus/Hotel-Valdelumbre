
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haga su reserva - Hotel Valdelumbre</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body style="background-color: #f5efe6; color: #2b1d14; font-family: 'Lora', Georgia, serif; font-size: 18px; font-weight: 400; max-width: 820px; margin: 30px auto; padding: 25px; border: 1px solid #d6c5b3; border-radius: 8px;">

  <h1 style="font-family: Georgia, serif; font-weight: 900; color: forestgreen; font-size: 55px; line-height: 1.1; margin-top: 10px; margin-bottom: 8px; text-align: center; text-shadow: 2px 2px 4px rgba(59, 40, 28, 0.25);">
    HAGA SU RESERVA
  </h1>

  <h2 style="font-family: 'Dancing Script', cursive; color: #5c3a21; font-size: 30px; font-weight: 600; margin-top: 10px; margin-bottom: 25px; text-align: center;">
    Tu escapada perfecta comienza aquí
  </h2>

  <form action="procesareserva.php" method="get">

    <fieldset style="border: 1px solid #d6c5b3; border-radius: 6px; padding: 20px; margin-bottom: 22px; background-color: #fbf8f3;">

      <legend style="font-family: 'Lora', Georgia, serif; color: #8c4a27; font-weight: bold; font-size: 20px; padding: 0 10px;">
        Datos Personales
      </legend>

      <p>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required maxlength="100" autofocus style="margin-top: 7px; padding: 10px; width: 95%; border: 1px solid #cbb8a5; border-radius: 5px; font-family: 'Lora', Georgia, serif; font-size: 16px; background-color: white;">
      </p>

      <p>
        <label for="apellidos">Apellidos:</label><br>
        <input type="text" id="apellidos" name="apellidos" required maxlength="100" style="margin-top: 7px; padding: 10px; width: 95%; border: 1px solid #cbb8a5; border-radius: 5px; font-family: 'Lora', Georgia, serif; font-size: 16px; background-color: white;">
      </p>

      <p>
        <label for="dni">DNI:</label><br>
        <input type="text" id="dni" name="dni" required maxlength="10" placeholder="DNI con letra" style="margin-top: 7px; padding: 10px; width: 95%; border: 1px solid #cbb8a5; border-radius: 5px; font-family: 'Lora', Georgia, serif; font-size: 16px; background-color: white;">
      </p>

    </fieldset>

    <fieldset style="border: 1px solid #d6c5b3; border-radius: 6px; padding: 20px; margin-bottom: 22px; background-color: #fbf8f3;">

      <legend style="font-family: 'Lora', Georgia, serif; color: #8c4a27; font-weight: bold; font-size: 20px; padding: 0 10px;">
        Datos de su estancia
      </legend>

      <p>
        <span>Tipo de habitación:</span><br><br>

        <input type="radio" id="hab-individual" name="habitacion" value="Individual" required>
        <label for="hab-individual">Individual</label>

        <br><br>

        <input type="radio" id="hab-doble" name="habitacion" value="Doble">
        <label for="hab-doble">Doble</label>

        <br><br>

        <input type="radio" id="hab-triple" name="habitacion" value="Triple">
        <label for="hab-triple">Triple</label>
      </p>

      <p>
        <label for="num-personas">Número de personas:</label><br>
        <select id="num-personas" name="num_personas" style="margin-top: 7px; padding: 9px; border: 1px solid #cbb8a5; border-radius: 5px; font-family: 'Lora', Georgia, serif; font-size: 16px; background-color: white;">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </p>

      <p>
        <input type="checkbox" id="mascotas" name="mascotas" value="si">
        <label for="mascotas">Llevo mascotas</label>
      </p>

      <p>
        <label for="fecha-llegada">Fecha de llegada:</label><br>
        <input type="date" id="fecha-llegada" name="fecha_llegada" style="margin-top: 7px; padding: 9px; border: 1px solid #cbb8a5; border-radius: 5px; font-family: 'Lora', Georgia, serif; font-size: 16px; background-color: white;">
      </p>

      <p>
        <label for="hora-llegada">Hora de llegada:</label><br>
        <input type="time" id="hora-llegada" name="hora_llegada" style="margin-top: 7px; padding: 9px; border: 1px solid #cbb8a5; border-radius: 5px; font-family: 'Lora', Georgia, serif; font-size: 16px; background-color: white;">
      </p>

    </fieldset>

    <p style="text-align: center; margin-top: 25px;">
      <button type="submit" style="background-color: #8c4a27; color: #fffaf3; padding: 12px 25px; border: none; border-radius: 5px; font-family: 'Lora', Georgia, serif; font-size: 17px; font-weight: bold; cursor: pointer; margin-right: 10px;">
        Enviar reserva
      </button>

      <button type="reset" style="background-color: #d6c5b3; color: #2b1d14; padding: 12px 25px; border: none; border-radius: 5px; font-family: 'Lora', Georgia, serif; font-size: 17px; cursor: pointer;">
        Reiniciar
      </button>
    </p>

  </form>

  <p style="text-align: center; margin-top: 25px;">
    <a href="index.html" style="color: #8c4a27; font-weight: bold; text-decoration: none;">
      ← Volver a la página principal
    </a>
  </p>

</body>
</html>
